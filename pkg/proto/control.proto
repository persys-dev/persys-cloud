syntax = "proto3";

package persys.control.v1;

option go_package = "github.com/persys-dev/persys/api/control/v1;controlv1";

import "google/protobuf/timestamp.proto";

service AgentControl {
  // Registration
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);

  // Heartbeat
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // Workload lifecycle
  rpc ApplyWorkload(ApplyWorkloadRequest) returns (ApplyWorkloadResponse);
  rpc DeleteWorkload(DeleteWorkloadRequest) returns (DeleteWorkloadResponse);

  // Retry trigger
  rpc RetryWorkload(RetryWorkloadRequest) returns (RetryWorkloadResponse);

  // Node management
  rpc DrainNode(DrainNodeRequest) returns (DrainNodeResponse);
  rpc UndrainNode(UndrainNodeRequest) returns (UndrainNodeResponse);
  rpc TaintNode(TaintNodeRequest) returns (TaintNodeResponse);
  rpc UntaintNode(UntaintNodeRequest) returns (UntaintNodeResponse);
  rpc SetNodeLabel(SetNodeLabelRequest) returns (SetNodeLabelResponse);
  rpc DeleteNodeLabel(DeleteNodeLabelRequest) returns (DeleteNodeLabelResponse);
  rpc SubmitAutomationSuggestion(SubmitAutomationSuggestionRequest) returns (SubmitAutomationSuggestionResponse);

  // Cluster and node management visibility
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  rpc ListWorkloads(ListWorkloadsRequest) returns (ListWorkloadsResponse);
  rpc GetWorkload(GetWorkloadRequest) returns (GetWorkloadResponse);
  rpc GetClusterSummary(GetClusterSummaryRequest) returns (GetClusterSummaryResponse);

  // Cluster-wide events: node joined, node lost, node left, workload
  // scheduled, drift detected, retries, reschedules, etc (see
  // internal/scheduler/events.go for producers). ListEvents is a
  // plain unary call (auto-bridged to REST by persys-gateway's
  // reflection-based grpcbridge, no gateway changes needed). WatchEvents
  // is a server-streaming call — grpcbridge explicitly does not bridge
  // streaming RPCs, so consumers that need HTTP (e.g. a browser
  // dashboard) go through a hand-written SSE endpoint on the gateway
  // instead of the generic bridge; a gRPC client (e.g. persysctl) can
  // call it directly.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  rpc WatchEvents(WatchEventsRequest) returns (stream SchedulerEventView);

  // Optional future streaming channel
  rpc ControlStream(stream ControlMessage) returns (stream ControlMessage);

  // Standalone disk inventory (managed volumes)
  rpc CreateDisk(CreateDiskRequest) returns (CreateDiskResponse);
  rpc ListDisks(ListDisksRequest) returns (ListDisksResponse);
  rpc GetDisk(GetDiskRequest) returns (GetDiskResponse);
  rpc DeleteDisk(DeleteDiskRequest) returns (DeleteDiskResponse);

  // Object storage (Ceph RGW / S3-compatible buckets)
  rpc CreateBucket(CreateBucketRequest) returns (CreateBucketResponse);
  rpc ListBuckets(ListBucketsRequest) returns (ListBucketsResponse);
  rpc GetBucket(GetBucketRequest) returns (GetBucketResponse);
  rpc DeleteBucket(DeleteBucketRequest) returns (DeleteBucketResponse);
  rpc GetBucketAccess(GetBucketAccessRequest) returns (GetBucketAccessResponse);
  rpc ListBucketObjects(ListBucketObjectsRequest) returns (ListBucketObjectsResponse);
}

enum AutomationActionType {
  AUTOMATION_ACTION_TYPE_UNSPECIFIED = 0;
  AUTOMATION_ACTION_SET_DESIRED_STATE = 1;
  AUTOMATION_ACTION_RETRY_WORKLOAD = 2;
  AUTOMATION_ACTION_DELETE_WORKLOAD = 3;
  AUTOMATION_ACTION_SCALE_REPLICAS = 4;
}

message AutomationSuggestion {
  string suggestion_id = 1;
  string policy_id = 2;
  string policy_name = 3;
  string target_workload = 4;
  AutomationActionType action_type = 5;
  string desired_state = 6;
  int32 desired_replicas = 7;
  int32 replica_delta = 8;
  string reason = 9;
  google.protobuf.Timestamp suggested_at = 10;
}

message SubmitAutomationSuggestionRequest {
  AutomationSuggestion suggestion = 1;
}

message SubmitAutomationSuggestionResponse {
  bool accepted = 1;
  string decision = 2;
  string reason = 3;
  string applied_action = 4;
  google.protobuf.Timestamp decided_at = 5;
}

message RegisterNodeRequest {
  string node_id = 1;
  NodeCapabilities capabilities = 2;
  map<string, string> labels = 3;
  string agent_version = 4;
  string grpc_endpoint = 5;
  string cluster_id = 6;
  google.protobuf.Timestamp timestamp = 7;
}

message NodeCapabilities {
  int64 cpu_total_millicores = 1;
  int64 memory_total_mb = 2;
  repeated StoragePool storage_pools = 3;
  repeated string supported_workload_types = 4; // container, compose, vm
  repeated string supported_storage_drivers = 5; // local, nfs, ceph-rbd
}

message StoragePool {
  string name = 1;
  string type = 2; // local, nfs, iscsi
  int64 total_gb = 3;
}

message RegisterNodeResponse {
  bool accepted = 1;
  string reason = 2;
  int32 heartbeat_interval_seconds = 3;
  google.protobuf.Timestamp lease_expires_at = 4;
}

message HeartbeatRequest {
  string node_id = 1;
  NodeUsage usage = 2;
  repeated WorkloadStatus workload_statuses = 3;
  google.protobuf.Timestamp timestamp = 4;
  repeated WorkloadUsageSnapshot workload_usage = 5;
}

message NodeUsage {
  int64 cpu_allocated_millicores = 1;
  int64 cpu_used_millicores = 2;
  int64 memory_allocated_mb = 3;
  int64 memory_used_mb = 4;
  int64 disk_allocated_gb = 5;
  int64 disk_used_gb = 6;
}

message HeartbeatResponse {
  bool acknowledged = 1;
  bool drain_node = 2;
  google.protobuf.Timestamp lease_expires_at = 3;
}

message ApplyWorkloadRequest {
  string workload_id = 1;
  WorkloadSpec spec = 2;

  // Compatibility fields aligned with existing agent apply semantics.
  string revision_id = 10;
  string desired_state = 11; // Running | Stopped
}

message ApplyWorkloadResponse {
  bool success = 1;
  FailureReason failure_reason = 2;
  string error_message = 3;
}

message DeleteWorkloadRequest {
  string workload_id = 1;
}

message DeleteWorkloadResponse {
  bool success = 1;
  string error_message = 2;
}

message WorkloadSpec {
  string type = 1; // container, compose, vm
  ResourceRequirements resources = 2;

  oneof workload {
    ContainerSpec container = 10;
    ComposeSpec compose = 11;
    VMSpec vm = 12;
  }

  map<string, string> metadata = 20;
}

message ResourceRequirements {
  int64 cpu_millicores = 1;
  int64 memory_mb = 2;
  int64 disk_gb = 3;
}

message ContainerSpec {
  string image = 1;
  repeated string command = 2;
  map<string, string> env = 3;
  repeated VolumeMount volumes = 4;
  repeated Port ports = 5;
  string restart_policy = 6;
  bool privileged = 7;
  repeated ManagedVolumeSpec managed_volumes = 8;
}

message VolumeMount {
  string host_path = 1;
  string container_path = 2;
  bool read_only = 3;
}

message Port {
  int32 host_port = 1;
  int32 container_port = 2;
  string protocol = 3; // tcp or udp
}

message ComposeSpec {
  string source_type = 1; // git or inline
  string git_repo = 2;
  string git_ref = 3;
  string inline_yaml = 4;
  map<string, string> env = 5;
}

message VMSpec {
  int32 vcpus = 1;
  int64 memory_mb = 2;
  repeated DiskConfig disks = 3;
  repeated NetworkConfig networks = 4;
  CloudInitConfig cloud_init = 5;
  string os_image = 6;
  repeated ManagedVolumeSpec managed_volumes = 7;
}

message DiskConfig {
  string pool_name = 1;
  int64 size_gb = 2;
  string mount_point = 3;
}

message NetworkConfig {
  string bridge = 1;
  bool dhcp = 2;
  string static_ip = 3;
}

message CloudInitConfig {
  string user_data = 1;
  string meta_data = 2;
  string network_config = 3;
  string vendor_data = 4;
}

message ManagedVolumeSpec {
  string name = 1;
  string driver = 2; // local|nfs|ceph-rbd
  int64 size_gb = 3;
  string access_mode = 4;
  string fs_type = 5;
  string mount_path = 6;
  bool read_only = 7;
  string retain_policy = 8; // Delete|Retain
}

message WorkloadUsageSnapshot {
  string workload_id = 1;
  string type = 2;
  double cpu_percent = 3;
  int64 memory_bytes = 4;
  int64 disk_read_bytes = 5;
  int64 disk_write_bytes = 6;
  int64 net_rx_bytes = 7;
  int64 net_tx_bytes = 8;
  google.protobuf.Timestamp collected_at = 9;
  string source = 10;
}

message ReasonDetail {
  string code = 1;
  string message = 2;
  google.protobuf.Timestamp last_transition = 3;
  google.protobuf.Timestamp next_retry_at = 4;
  bool retryable = 5;
}

message WorkloadStatus {
  string workload_id = 1;
  string state = 2; // Running, Stopped, Failed
  FailureReason failure_reason = 3;
  string message = 4;
  google.protobuf.Timestamp last_transition = 5;
  ReasonDetail reason = 6;
  WorkloadUsageSnapshot usage = 7;
}

enum FailureReason {
  FAILURE_REASON_UNSPECIFIED = 0;
  IMAGE_PULL_FAILED = 1;
  IMAGE_NOT_FOUND = 2;
  INSUFFICIENT_RESOURCES = 3;
  INVALID_SPEC = 4;
  RUNTIME_ERROR = 5;
  NETWORK_ERROR = 6;
  STORAGE_ERROR = 7;
  VM_BOOT_FAILED = 8;
}

message RetryWorkloadRequest {
  string workload_id = 1;
}

message RetryWorkloadResponse {
  bool accepted = 1;
}

message DrainNodeRequest {
  string node_id = 1;
  string reason = 2;
}

message DrainNodeResponse {
  bool accepted = 1;
  string message = 2;
  int32 relocated_workloads = 3;
  NodeView node = 4;
}

message UndrainNodeRequest {
  string node_id = 1;
  string reason = 2;
}

message UndrainNodeResponse {
  bool accepted = 1;
  string message = 2;
  NodeView node = 3;
}

message NodeTaint {
  string key = 1;
  string value = 2;
  string effect = 3; // NoSchedule | PreferNoSchedule
}

message TaintNodeRequest {
  string node_id = 1;
  NodeTaint taint = 2;
}

message TaintNodeResponse {
  bool accepted = 1;
  string message = 2;
  NodeView node = 3;
}

message UntaintNodeRequest {
  string node_id = 1;
  string key = 2;
  string effect = 3;
}

message UntaintNodeResponse {
  bool accepted = 1;
  string message = 2;
  NodeView node = 3;
}

message SetNodeLabelRequest {
  string node_id = 1;
  string key = 2;
  string value = 3;
}

message SetNodeLabelResponse {
  bool accepted = 1;
  string message = 2;
  NodeView node = 3;
}

message DeleteNodeLabelRequest {
  string node_id = 1;
  string key = 2;
}

message DeleteNodeLabelResponse {
  bool accepted = 1;
  string message = 2;
  NodeView node = 3;
}

message ListNodesRequest {
  string status = 1; // optional filter: Ready | NotReady | Draining
}

message GetNodeRequest {
  string node_id = 1;
}

message ListNodesResponse {
  repeated NodeView nodes = 1;
}

message GetNodeResponse {
  NodeView node = 1;
}

message NodeView {
  string node_id = 1;
  string status = 2;
  string status_reason = 3;
  string status_updated_by = 4;
  google.protobuf.Timestamp status_updated_at = 5;
  google.protobuf.Timestamp last_heartbeat = 6;
  string grpc_endpoint = 7;
  double total_cpu_cores = 8;
  double available_cpu_cores = 9;
  int64 total_memory_mb = 10;
  int64 available_memory_mb = 11;
  repeated string supported_workload_types = 12;
  map<string, string> labels = 13;
  repeated NodeTaint taints = 14;
}

message ListWorkloadsRequest {
  string node_id = 1; // optional filter
  string status = 2; // optional filter
}

message SchedulerEventView {
  string id = 1;
  string type = 2; // e.g. "NodeLost", "WorkloadScheduled", "DriftDetected"
  string workload_id = 3; // optional, empty if not workload-scoped
  string node_id = 4; // optional, empty if not node-scoped
  string reason = 5;
  google.protobuf.Timestamp timestamp = 6;
  // Free-form auxiliary data. Values are stringified on the way out
  // (models.SchedulerEvent.Details is map[string]interface{} on the Go
  // side) — this is a deliberate simplification over a
  // google.protobuf.Struct, since event details are informational/
  // display-oriented, not structured data a client needs to
  // round-trip losslessly.
  map<string, string> details = 7;
}

message ListEventsRequest {
  int64 limit = 1; // 0 means server default
  string type = 2; // optional filter
  string workload_id = 3; // optional filter
  string node_id = 4; // optional filter
}

message ListEventsResponse {
  repeated SchedulerEventView events = 1;
}

message WatchEventsRequest {
  // Same optional filters as ListEventsRequest. The stream first replays
  // recent matching events (server-side default limit), then continues
  // with new matching events as they're emitted.
  string type = 1;
  string workload_id = 2;
  string node_id = 3;
}

message GetWorkloadRequest {
  string workload_id = 1;
}

message ListWorkloadsResponse {
  repeated WorkloadView workloads = 1;
}

message GetWorkloadResponse {
  WorkloadView workload = 1;
}

message WorkloadView {
  string workload_id = 1;
  string type = 2;
  string desired_state = 3;
  string status = 4;
  string assigned_node_id = 5;
  string revision_id = 6;
  int32 retry_attempts = 7;
  int32 retry_max_attempts = 8;
  google.protobuf.Timestamp retry_next_at = 9;
  string failure_reason = 10;
  google.protobuf.Timestamp last_updated = 11;
  ReasonDetail reason = 12;
  WorkloadUsageSnapshot usage = 13;
  google.protobuf.Timestamp created_at = 14;
}

message GetClusterSummaryRequest {}

message GetClusterSummaryResponse {
  int32 total_nodes = 1;
  int32 ready_nodes = 2;
  int32 not_ready_nodes = 3;
  int32 total_workloads = 4;
  int32 running_workloads = 5;
  int32 pending_workloads = 6;
  int32 failed_workloads = 7;
  int32 deleted_workloads = 8;
  google.protobuf.Timestamp generated_at = 9;
}

message ControlMessage {
  oneof message {
    RegisterNodeRequest register = 1;
    HeartbeatRequest heartbeat = 2;
    ApplyWorkloadRequest apply = 3;
    DeleteWorkloadRequest delete = 4;
  }
}

// --- Standalone disks (control-plane inventory) ---

message CreateDiskRequest {
  string name = 1;
  string driver = 2; // local | ceph-rbd | nfs
  int64 size_gb = 3;
  string fs_type = 4;
  string access_mode = 5;
  string retain_policy = 6; // Delete | Retain
  string node_id = 7; // optional pre-pin for local
  string mount_path = 8;
}

message CreateDiskResponse {
  DiskView disk = 1;
}

message ListDisksRequest {}

message ListDisksResponse {
  repeated DiskView disks = 1;
}

message GetDiskRequest {
  string disk_id = 1;
}

message GetDiskResponse {
  DiskView disk = 1;
}

message DeleteDiskRequest {
  string disk_id = 1;
  bool force = 2;
}

message DeleteDiskResponse {
  bool success = 1;
  string error_message = 2;
}

message DiskView {
  string id = 1;
  string name = 2;
  string driver = 3;
  int64 size_gb = 4;
  string fs_type = 5;
  string access_mode = 6;
  string retain_policy = 7;
  string phase = 8;
  string last_error = 9;
  string node_id = 10;
  string device = 11;
  bool standalone = 12;
  string mount_path = 13;
  repeated string workload_refs = 14;
  repeated string attached_nodes = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
}

// --- Object storage (Ceph RGW / S3-compatible) ---

message CreateBucketRequest {
  string name = 1;
  string region = 2;
  bool versioning = 3;
}

message CreateBucketResponse {
  BucketView bucket = 1;
  BucketAccess access = 2; // credentials returned once on create
}

message ListBucketsRequest {}

message ListBucketsResponse {
  repeated BucketView buckets = 1;
}

message GetBucketRequest {
  string bucket_id = 1; // id or name
}

message GetBucketResponse {
  BucketView bucket = 1;
}

message DeleteBucketRequest {
  string bucket_id = 1;
  bool force = 2;
}

message DeleteBucketResponse {
  bool success = 1;
  string error_message = 2;
}

message GetBucketAccessRequest {
  string bucket_id = 1;
}

message GetBucketAccessResponse {
  BucketAccess access = 1;
}

message ListBucketObjectsRequest {
  string bucket_id = 1;
  string prefix = 2;
  string continuation_token = 3;
  int32 max_keys = 4;
}

message ListBucketObjectsResponse {
  repeated ObjectInfo objects = 1;
  string next_continuation_token = 2;
  bool is_truncated = 3;
  string prefix = 4;
}

message BucketView {
  string id = 1;
  string name = 2;
  string region = 3;
  string owner = 4;
  string endpoint = 5;
  bool versioning = 6;
  int64 object_count = 7;
  int64 size_bytes = 8;
  string phase = 9;
  string last_error = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message BucketAccess {
  string endpoint = 1;
  string region = 2;
  string bucket = 3;
  string access_key = 4;
  string secret_key = 5;
  string vault_path = 6; // when secrets live in Vault
  string s3_url = 7; // e.g. s3://bucket
}

message ObjectInfo {
  string key = 1;
  int64 size_bytes = 2;
  string etag = 3;
  string last_modified = 4;
  string storage_class = 5;
}