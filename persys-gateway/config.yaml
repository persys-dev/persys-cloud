service_name: persys-gateway

# Single toggle deciding the whole deployment posture. "self-hosted"
# (default) needs no GitHub OAuth app and no database — see
# database.dsn below and README.md's "Deployment Modes" section.
# "managed" mounts GitHub OAuth and requires database.dsn to be set
# (fails fast at startup otherwise).
deployment:
  mode: self-hosted

app:
  http_addr: ":8551"
  http_addr_public: ":8585"
  grpc_addr: ":8661"
  oauth_redirect_url: "http://localhost:8585/auth"
  metadata:
    name: persys-gateway
  # Signs/verifies user session JWTs. Leave unset for self-hosted local
  # dev — a random secret is generated at startup with a warning (won't
  # survive a restart). Set explicitly via PERSYS_GATEWAY_JWT_SECRET
  # (preferred) or here for anything long-lived, and required if
  # deployment.mode is "managed".
  jwt_secret: ""

# Postgres. Leave dsn empty for self-hosted — the gateway runs with no
# database at all in that mode (see README.md). Required if
# deployment.mode is "managed". Prefer PERSYS_GATEWAY_POSTGRES_DSN over
# committing a real DSN here.
database:
  dsn: ""
  max_conns: 10

tls:
  enabled: true
  cert_path: "/etc/persys/certs/persys-gateway/tls.crt"
  key_path: "/etc/persys/certs/persys-gateway/tls.key"
  ca_path: "/etc/persys/certs/persys-gateway/ca.pem"
  require_client_cert: true

vault:
  enabled: true
  manager_addr: ""
  addr: "http://localhost:8200"
  auth_method: "approle"
  token: ""
  approle_id: ""
  approle_secret_id: ""
  pki_mount: "pki"
  pki_role: "persys-gateway"
  cert_ttl: "24h"
  retry_interval: "30s"
  service_name: "persys-gateway"
  service_domain: "persys.local"
  bind_host: ""

core_dns:
  addr: "coredns:53"

# Fallback path used only when the scheduler pool (see cluster.yaml)
# can't resolve a candidate for a cluster — e.g. a single-scheduler
# deployment that hasn't set up cluster.yaml at all. Renamed from
# "prow", which didn't describe what this does.
legacy_scheduler:
  fallback_addr: "persys-scheduler:8085"
  proxy_enabled: true
  discovery_domain: "persys.local"
  discovery_service: "_persys-scheduler"

scheduler:
  health_path: "/health"
  health_check_interval: "15s"
  discovery_interval: "30s"
  request_timeout: "10s"

# GitHub OAuth — only read/used when deployment.mode is "managed".
github:
  webhook_url: "http://persys.eastus.cloudapp.azure.com/webhooks/github"
  default_secret: ""
  auth:
    client_id: ""
    client_secret: ""

webhook:
  public_path: "/webhooks/github"
  replay_ttl: "5m"
  forward_retries: 5
  forward_base_backoff: "1s"
  repository_secrets: {}

forgery:
  grpc_addr: "persys-forgery:8087"
  webhook_forward_url: "https://persys-forgery:8080/internal/webhooks/github"

log:
  loki_endpoint: "http://loki:3301"
  level: "debug"

telemetry:
  otlp_endpoint: "jaeger:4318"
