global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5s
    timeout client  300s
    timeout server  300s
    retries 3

# Docker's embedded DNS resolver. Using it (rather than a one-shot lookup
# at haproxy startup) is what lets this config track persys-scheduler
# being scaled up/down, and containers restarting with new IPs, without
# needing haproxy itself restarted.
resolvers dockerdns
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve  1s
    timeout retry    1s
    hold valid       10s

# HTTP (non-mTLS) API
frontend scheduler_http_in
    bind *:8084
    default_backend scheduler_http_back

backend scheduler_http_back
    balance roundrobin
    # server-template pre-declares N backend slots and lets each one
    # independently resolve/re-resolve "persys-scheduler" via Docker's
    # embedded DNS, which returns one address per replica of a scaled
    # Compose service. Bump the "3" if you scale the scheduler further.
    # init-addr none avoids haproxy refusing to start if the scheduler
    # containers aren't up yet when this container starts.
    server-template scheduler 3 persys-scheduler:8084 check inter 5s resolvers dockerdns init-addr none

# gRPC + mTLS API. mode tcp (inherited from defaults) is required here,
# not optional: this is mutual TLS between agent and scheduler, so haproxy
# must pass the raw TCP stream through untouched rather than terminate
# TLS itself — terminating here would break client-certificate
# verification on the scheduler side.
frontend scheduler_grpc_in
    bind *:8085
    default_backend scheduler_grpc_back

backend scheduler_grpc_back
    balance roundrobin
    server-template scheduler 3 persys-scheduler:8085 check inter 5s resolvers dockerdns init-addr none

frontend prometheus
  bind :8405
  mode http
  http-request use-service prometheus-exporter
  no log

