name: Compute Agent CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'compute-agent/**'
      - 'pkg/**'
      - 'sdk/**'
      - 'go.mod'
      - '.github/workflows/compute-agent-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'compute-agent/**'
      - 'pkg/**'
      - 'sdk/**'
      - 'go.mod'
      - '.github/workflows/compute-agent-ci.yml'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work          # Better for monorepo
          cache: true

      - name: Run unit tests with race and coverage
        run: |
          cd compute-agent
          make test-unit   # or go test ./... -race -coverprofile=coverage.txt

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: compute-agent/coverage.txt
          if-no-files-found: warn

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - name: Run end-to-end tests
        run: |
          cd compute-agent
          make test-e2e

  build-binaries:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - name: Build agent and client
        run: |
          cd compute-agent
          go build -v ./cmd/agent
          go build -v ./examples/client

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build optimized runtime image
        uses: docker/build-push-action@v6
        with:
          context: .                       # Root context
          file: ./compute-agent/Dockerfile
          target: runtime
          push: false
          tags: persys/compute-agent:ci-runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build full runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./compute-agent/Dockerfile
          target: full-runtime
          push: false
          tags: persys/compute-agent:ci-full-runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max